<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="catalogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <filter id="pageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#catalogBg)"/>

  <!-- Pre-press registration line -->
  <g opacity="0.4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#888">
    <circle cx="50" cy="40" r="14" fill="none" stroke="#fff" stroke-width="1"/>
    <line x1="30" y1="40" x2="70" y2="40" stroke="#fff" stroke-width="1"/>
    <line x1="50" y1="20" x2="50" y2="60" stroke="#fff" stroke-width="1"/>
    <text x="80" y="44">DALTEC LTD • CORPORATE IDENTITY &amp; TRADE DISTRIBUTOR CATALOG • A4 SPREAD</text>
    <text x="960" y="44" fill="#38bdf8">REF: Daltec.jpg • ARTWORK BY JONNY COKE</text>
  </g>

  <!-- Editorial Catalog Two-Page Open Spread -->
  <g transform="translate(100, 80)" filter="url(#pageShadow)">
    <!-- Page 1 (Left): Brand Identity & Overview -->
    <rect x="0" y="0" width="490" height="640" rx="8" fill="#ffffff"/>
    
    <!-- Left Page Header -->
    <rect x="0" y="0" width="490" height="130" fill="#0b1b3d"/>
    <text x="35" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
      DALTEC
    </text>
    <text x="35" y="95" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#38bdf8" letter-spacing="1">
      TRADE CATALOG &amp; COMMERCIAL SOLUTIONS 2022
    </text>

    <!-- Left Page Editorial Grid -->
    <g transform="translate(35, 160)" font-family="'Plus Jakarta Sans', sans-serif">
      <text x="0" y="24" font-weight="800" font-size="20" fill="#0f172a">
        UK Premier Commercial Vehicle
      </text>
      <text x="0" y="48" font-weight="800" font-size="20" fill="#0284c7">
        Technology Distribution
      </text>

      <line x1="0" y1="65" x2="420" y2="65" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="0" y="90" font-size="12" fill="#475569" leading="1.6">
        Daltec Ltd is a leading UK distributor of automotive electrical systems,
      </text>
      <text x="0" y="108" font-size="12" fill="#475569">
        specialising in commercial fleet safety, DVR camera networks, blind-spot
      </text>
      <text x="0" y="126" font-size="12" fill="#475569">
        radar detection, and premium mobile charging infrastructure.
      </text>

      <!-- Visual Feature Cards on Page -->
      <g transform="translate(0, 155)">
        <rect x="0" y="0" width="200" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <rect x="0" y="0" width="200" height="6" fill="#0284c7" rx="3"/>
        <text x="14" y="28" font-weight="700" font-size="13" fill="#0f172a">Commercial Fleet DVR</text>
        <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0284c7">4-CH &amp; 8-CH AHD Mobile</text>
        <text x="14" y="70" font-size="10" fill="#64748b">Shock-resistant storage,</text>
        <text x="14" y="85" font-size="10" fill="#64748b">GPS real-time telematics</text>
        <text x="14" y="102" font-size="10" fill="#64748b">&amp; remote 4G cloud backup.</text>
      </g>

      <g transform="translate(220, 155)">
        <rect x="0" y="0" width="200" height="120" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <rect x="0" y="0" width="200" height="6" fill="#10b981" rx="3"/>
        <text x="14" y="28" font-weight="700" font-size="13" fill="#0f172a">SCOSCHE Integration</text>
        <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Official UK Wholesale</text>
        <text x="14" y="70" font-size="10" fill="#64748b">MagicMount™ wireless fast</text>
        <text x="14" y="85" font-size="10" fill="#64748b">charge mounts, ruggedized</text>
        <text x="14" y="102" font-size="10" fill="#64748b">cables &amp; power adapters.</text>
      </g>

      <!-- Bottom Accreditation -->
      <g transform="translate(0, 305)">
        <rect x="0" y="0" width="420" height="85" rx="6" fill="#0f172a"/>
        <text x="20" y="30" font-weight="700" font-size="13" fill="#ffffff">CERTIFIED TRADE PARTNER ACCREDITATION</text>
        <text x="20" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">
          FORRS Silver • Direct Vision Standard (DVS) London Compliant
        </text>
        <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">
          Technical specifications layout artworked by Jonny Coke
        </text>
      </g>
    </g>

    <!-- Page Number Left -->
    <text x="45" y="615" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">DALTEC CATALOG 2022 • PAGE 04</text>

    <!-- Center Spine Crease / Binding -->
    <line x1="500" y1="0" x2="500" y2="640" stroke="#000" stroke-width="2" opacity="0.3"/>
    <rect x="490" y="0" width="20" height="640" fill="#000" opacity="0.08"/>

    <!-- Page 2 (Right): Product Category Grid -->
    <rect x="510" y="0" width="490" height="640" rx="8" fill="#ffffff"/>
    
    <!-- Right Page Header -->
    <rect x="510" y="0" width="490" height="50" fill="#f1f5f9"/>
    <text x="545" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">
      SECTION 02 • SENSOR NETWORKS &amp; DRIVER ASSISTANCE
    </text>
    <text x="965" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0284c7" text-anchor="end">
      SERIES V-200
    </text>

    <!-- Right Page Product Grid -->
    <g transform="translate(545, 75)" font-family="'Plus Jakarta Sans', sans-serif">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="420" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="14" y="14" width="80" height="82" rx="4" fill="#0b1b3d"/>
        <text x="54" y="58" font-family="'JetBrains Mono', monospace" font-size="20" fill="#38bdf8" text-anchor="middle">AHD</text>
        <text x="110" y="32" font-weight="800" font-size="13" fill="#0f172a">Side-Scan Ultrasonic Detection</text>
        <text x="110" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0284c7">SKU: DAL-SNS-SIDE-04</text>
        <text x="110" y="70" font-size="11" fill="#64748b">4-Sensor nearside cyclist detection system with</text>
        <text x="110" y="86" font-size="11" fill="#64748b">in-cab audible warning &amp; external voice alert.</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="420" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="14" y="14" width="80" height="82" rx="4" fill="#0b1b3d"/>
        <text x="54" y="58" font-family="'JetBrains Mono', monospace" font-size="20" fill="#10b981" text-anchor="middle">IP69</text>
        <text x="110" y="32" font-weight="800" font-size="13" fill="#0f172a">Twin-Lens Heavy Duty Reverse Camera</text>
        <text x="110" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0284c7">SKU: DAL-CAM-REV-TWIN</text>
        <text x="110" y="70" font-size="11" fill="#64748b">Dual camera for hitch view and rear traffic mirror</text>
        <text x="110" y="86" font-size="11" fill="#64748b">view with built-in infrared night illumination.</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 250)">
        <rect x="0" y="0" width="420" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="14" y="14" width="80" height="82" rx="4" fill="#0b1b3d"/>
        <text x="54" y="58" font-family="'JetBrains Mono', monospace" font-size="20" fill="#dfb15b" text-anchor="middle">7" IPS</text>
        <text x="110" y="32" font-weight="800" font-size="13" fill="#0f172a">Quad-Split High-Bright Dashboard Monitor</text>
        <text x="110" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0284c7">SKU: DAL-MON-QUAD7</text>
        <text x="110" y="70" font-size="11" fill="#64748b">Simultaneous 4-channel display, trigger wires</text>
        <text x="110" y="86" font-size="11" fill="#64748b">for reverse/indicator auto-switching.</text>
      </g>

      <!-- Bottom Order Notice -->
      <g transform="translate(0, 380)">
        <rect x="0" y="0" width="420" height="70" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="18" y="28" font-weight="700" font-size="12" fill="#1e40af">TRADE ENQUIRIES &amp; NEXT-DAY DESPATCH</text>
        <text x="18" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3b82f6">
          Phone: 01923 237 200 • orders@daltec.co.uk • Watford WD18 8TR
        </text>
      </g>
    </g>

    <!-- Page Number Right -->
    <text x="955" y="615" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="end">DALTEC CATALOG 2022 • PAGE 05</text>
  </g>

  <!-- Footer Annotation Bar -->
  <g transform="translate(100, 740)" font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="0" y="20" fill="#fff" font-weight="700">PORTFOLIO PIECE: DALTEC CORPORATE IDENTITY &amp; PRODUCT CATALOG SPREAD</text>
    <text x="640" y="20" fill="#38bdf8">ORIGINAL FILE: Daltec.jpg</text>
    <text x="0" y="38" fill="#64748b" font-size="9">A4 SPREAD LAYOUT • EDITORIAL ART DIRECTION • VECTOR ARTWORKING • JONNY COKE</text>
  </g>
</svg>
