<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="dewaltGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEB81C"/>
      <stop offset="100%" stop-color="#E09F00"/>
    </linearGradient>
    <linearGradient id="stanleyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#D9BC00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="diagStripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FEB81C" stroke-width="4" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#diagStripes)"/>

  <!-- Pre-press Registration Marks & Color Swatches -->
  <g opacity="0.4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#888">
    <circle cx="40" cy="40" r="14" fill="none" stroke="#fff" stroke-width="1"/>
    <line x1="20" y1="40" x2="60" y2="40" stroke="#fff" stroke-width="1"/>
    <line x1="40" y1="20" x2="40" y2="60" stroke="#fff" stroke-width="1"/>
    <text x="70" y="44">DRAGONFLY VENTURES • DEWALT/STANLEY POS SPEC • 300 DPI CMYK</text>

    <!-- Color calibration swatches -->
    <rect x="920" y="32" width="16" height="16" fill="#00AEEF"/>
    <rect x="942" y="32" width="16" height="16" fill="#EC008C"/>
    <rect x="964" y="32" width="16" height="16" fill="#FFF200"/>
    <rect x="986" y="32" width="16" height="16" fill="#000000"/>
    <rect x="1008" y="32" width="16" height="16" fill="#FEB81C"/>
    <text x="1035" y="44" fill="#aaa">PASS: ISO 12647-2</text>
  </g>

  <!-- POS Floor Display Stand Representation -->
  <g transform="translate(180, 80)" filter="url(#shadow)">
    <!-- Stand Outer Metal Structure -->
    <rect x="0" y="0" width="840" height="660" rx="20" fill="#1c1c22" stroke="#333" stroke-width="2"/>
    <rect x="12" y="12" width="816" height="636" rx="14" fill="#121216"/>

    <!-- Display Header Card -->
    <g transform="translate(24, 24)">
      <!-- Top Brand Header -->
      <rect x="0" y="0" width="792" height="120" rx="10" fill="#000" stroke="#FEB81C" stroke-width="2"/>
      
      <!-- DeWalt Side -->
      <rect x="10" y="10" width="375" height="100" rx="8" fill="url(#dewaltGrad)"/>
      <text x="197" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#111" text-anchor="middle" letter-spacing="2">DEWALT</text>
      <text x="197" y="85" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#222" text-anchor="middle" letter-spacing="3">GUARANTEED TOUGH WORKWEAR</text>

      <!-- Stanley Side -->
      <rect x="407" y="10" width="375" height="100" rx="8" fill="#1a1a1a" stroke="#FFDD00" stroke-width="2"/>
      <rect x="407" y="10" width="375" height="24" fill="url(#stanleyGrad)"/>
      <text x="594" y="27" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="11" fill="#111" text-anchor="middle" letter-spacing="2">STANLEY FATMAX &amp; PRO SYSTEMS</text>
      <text x="594" y="68" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="30" fill="#FFDD00" text-anchor="middle" letter-spacing="2">STANLEY</text>
      <text x="594" y="92" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#bbb" text-anchor="middle" letter-spacing="1">ENGINEERED PERFORMANCE APPAREL</text>
    </g>

    <!-- Retail Display Shelving Graphics -->
    <g transform="translate(24, 160)">
      <!-- Shelf 1: Heavy Duty Workwear Jackets & Vests -->
      <rect x="0" y="0" width="792" height="140" rx="8" fill="#18181f" stroke="#2d2d38" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="140" fill="#FEB81C"/>
      <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#fff">SHELF TIER 1 • HIGH-VISIBILITY HEAVY-DUTY OUTERWEAR</text>
      <text x="24" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FEB81C">MODULAR POINT-OF-SALE APPAREL HOOKS &amp; RETAIL FACINGS</text>
      
      <!-- POS Mock Product Cards -->
      <g transform="translate(24, 64)">
        <rect x="0" y="0" width="165" height="60" rx="6" fill="#222" stroke="#444"/>
        <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#fff">Pro Storm-Shield</text>
        <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#aaa">CORDURA® Ripstop</text>
        <rect x="110" y="30" width="45" height="18" rx="4" fill="#FEB81C"/>
        <text x="132" y="43" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#000" text-anchor="middle">NEW</text>
      </g>
      <g transform="translate(205, 64)">
        <rect x="0" y="0" width="165" height="60" rx="6" fill="#222" stroke="#444"/>
        <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#fff">FatMax Tool Vest</text>
        <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#aaa">Modular Holster Bags</text>
      </g>
      <g transform="translate(385, 64)">
        <rect x="0" y="0" width="165" height="60" rx="6" fill="#222" stroke="#444"/>
        <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#fff">Extreme Flex Trousers</text>
        <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#aaa">4-Way Stretch Nylon</text>
      </g>
      <g transform="translate(565, 64)">
        <rect x="0" y="0" width="200" height="60" rx="6" fill="#262312" stroke="#FEB81C" stroke-width="1"/>
        <text x="12" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FEB81C">TRADE STOCKIST KIT</text>
        <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">48-Hour Merchant Replenishment</text>
      </g>
    </g>

    <!-- Shelf 2: Safety Footwear & Accessories -->
    <g transform="translate(24, 320)">
      <rect x="0" y="0" width="792" height="140" rx="8" fill="#18181f" stroke="#2d2d38" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="140" fill="#FFDD00"/>
      <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#fff">SHELF TIER 2 • COMPOSITE SAFETY FOOTWEAR &amp; KNEE SYSTEMS</text>
      <text x="24" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFDD00">DIE-CUT SHELF STRIPS • S3 EN-ISO SPECIFICATIONS</text>
      
      <g transform="translate(24, 64)">
        <rect x="0" y="0" width="235" height="60" rx="6" fill="#222" stroke="#444"/>
        <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#fff">DeWalt Titanium Safety Boot</text>
        <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#aaa">S3 WR HRO SRC Certified</text>
      </g>
      <g transform="translate(275, 64)">
        <rect x="0" y="0" width="235" height="60" rx="6" fill="#222" stroke="#444"/>
        <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#fff">Stanley Kneepad Inserts</text>
        <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#aaa">Ergonomic Gel Impact Core</text>
      </g>
      <g transform="translate(525, 64)">
        <rect x="0" y="0" width="240" height="60" rx="6" fill="#1f1a26" stroke="#c084fc" stroke-width="1"/>
        <text x="12" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#e9d5ff">Interactive AR QR Scanner</text>
        <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#bbb">Scan Tag to View 3D Spec on Phone</text>
      </g>
    </g>

    <!-- Lower Plinth & Footer Display -->
    <g transform="translate(24, 480)">
      <rect x="0" y="0" width="792" height="156" rx="8" fill="#0f0f13" stroke="#252530" stroke-width="1.5"/>
      <rect x="20" y="20" width="752" height="4" fill="url(#dewaltGrad)"/>

      <text x="396" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle">
        LICENSED BY STANLEY BLACK &amp; DECKER
      </text>
      <text x="396" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#888" text-anchor="middle">
        CREATIVE DIRECTION &amp; POS ARTWORK: JONNY COKE • DRAGONFLY VENTURES
      </text>
      <text x="396" y="105" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FEB81C" text-anchor="middle">
        NATIONWIDE MERCHANT RETAIL ROLLOUT • UK &amp; EUROPE
      </text>
      <text x="396" y="130" font-family="'JetBrains Mono', monospace" font-size="10" fill="#555" text-anchor="middle">
        ASSET ARCHIVE REF: Dragonfly Ventures - IMG_3937.jpg
      </text>
    </g>
  </g>
</svg>
